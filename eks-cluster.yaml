apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: mandy-eks-lab
  region: us-east-1
  version: "1.36"

availabilityZones:
  - us-east-1a
  - us-east-1b

managedNodeGroups:
  - name: mandy-workers
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    privateNetworking: true